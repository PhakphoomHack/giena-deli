<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F1E7">
<title>Kitchen · Giena's Deli</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300..600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F6F1E7;color:#1B2238;font-family:Jost,'Sarabun',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #8A6A2F;outline-offset:2px}
.serif{font-family:'Bodoni Moda',Didot,serif}
.label{font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.ticket{animation:drop .4s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.press:active{transform:scale(.98)}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.zig{height:10px;background:linear-gradient(-45deg,#FFFFFF 5px,transparent 0),linear-gradient(45deg,#FFFFFF 5px,transparent 0);background-size:10px 10px;background-repeat:repeat-x;background-position:left bottom}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;padding:16px 20px 40px;align-items:start}
.flash{animation:flash 1.2s ease 3}
@keyframes flash{50%{background:#E8D49A}}
.sent{position:fixed;left:50%;bottom:28px;z-index:30;display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100vw - 32px);padding:14px 22px 14px 14px;background:#FFFFFF;border:2px solid #1B2238;border-radius:22px;box-shadow:0 14px 34px rgba(27,34,56,.25);transform:translateX(-50%);animation:sentIn .5s cubic-bezier(.2,1.5,.4,1) both,sentOut .45s ease-in 2.7s forwards}
@keyframes sentIn{from{opacity:0;transform:translate(-50%,40px) scale(.8)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes sentOut{to{opacity:0;transform:translate(-50%,20px) scale(.95)}}
.sent-ic{width:52px;height:52px;flex:none;border-radius:50%;background:#FFE9A8;display:flex;align-items:center;justify-content:center;animation:sentFly 1.1s cubic-bezier(.5,-.4,.6,1) .55s both}
@keyframes sentFly{0%{transform:none}35%{transform:translate(-4px,4px) rotate(-8deg)}100%{transform:translate(0,0) rotate(0)}}
.sent-ic svg{animation:sentPlane 1.1s cubic-bezier(.5,-.4,.6,1) .55s both}
@keyframes sentPlane{0%{transform:none;opacity:1}60%{transform:translate(60px,-70px) rotate(12deg);opacity:0}61%{transform:translate(-30px,30px);opacity:0}100%{transform:none;opacity:1}}
.sent-sp{position:absolute;left:40px;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);opacity:0;animation:sentSp .8s ease-out .6s forwards;transform:rotate(var(--a)) translateY(0)}
@keyframes sentSp{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(-46px)}}
@media (prefers-reduced-motion: reduce){.sent,.sent-ic,.sent-ic svg,.sent-sp{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { h, render, Component } from './vendor/preact.js';
import htm from './vendor/htm.js';
import { rpc } from './config.js';
const html = htm.bind(h);
const INK = '#1B2238';
const KEY = new URLSearchParams(location.hash.slice(1)).get('k') || '';
const COLS = [
  { key: 'new', title: 'New', dot: '#F9D6DF', flag: '#C2416B', empty: 'No new orders', btn: 'Start making', next: 'making', prev: null },
  { key: 'making', title: 'Making', dot: '#FFE9A8', flag: '#E9B92C', empty: 'Nothing on the board', btn: 'Mark ready', next: 'ready', prev: 'new' },
  { key: 'ready', title: 'Ready to collect', dot: '#D9E6F1', flag: '#7FA8CF', empty: 'Nothing waiting', btn: 'Collected', next: 'collected', prev: 'making' }
];
const LANG = { en: 'English', th: 'ภาษาไทย', de: 'Deutsch' };
const ago = (t) => { const m = Math.max(0, Math.round((Date.now() - new Date(t).getTime()) / 60000)); return m < 1 ? 'just now' : m === 1 ? '1 min ago' : m + ' min ago'; };

class Kitchen extends Component {
  constructor() { super(); this.state = { orders: [], loaded: false, denied: false, offline: false, alerts: false, stats: null, fresh: {}, confirmDel: null, sent: null, manage: false, wishes: [], resetText: '', armOrders: false, resetMsg: '', resetBusy: false }; this.seen = null; }
  componentDidMount() { this.load(); this.timer = setInterval(() => this.load(), 3000); this.clock = setInterval(() => this.forceUpdate(), 30000); }
  async load() {
    if (!KEY) { this.setState({ denied: true, loaded: true }); return; }
    try {
      const [orders, stats] = await Promise.all([rpc('kitchen_orders', { p_key: KEY }), rpc('kitchen_stats', { p_key: KEY })]);
      const ids = new Set(orders.map((o) => o.id));
      const fresh = { ...this.state.fresh };
      let added = 0;
      if (this.seen) orders.forEach((o) => { if (!this.seen.has(o.id)) { fresh[o.id] = Date.now(); added++; } });
      this.seen = ids;
      Object.keys(fresh).forEach((k) => { if (Date.now() - fresh[k] > 90000) delete fresh[k]; });
      if (added) this.alert(added);
      this.setState({ orders, stats, fresh, loaded: true, offline: false, denied: false });
      if (this.state.manage) this.loadWishes();
    } catch (e) {
      const denied = String(e.message).includes('not allowed') || String(e.message).startsWith('403');
      this.setState({ denied, offline: !denied, loaded: true });
    }
  }
  alert(n) {
    const newCount = this.state.orders.filter((o) => o.status === 'new').length + n;
    document.title = '(' + newCount + ') New order · Kitchen';
    setTimeout(() => { document.title = "Kitchen · Giena's Deli"; }, 8000);
    if (!this.state.alerts || !this.ctx) return;
    const t = this.ctx.currentTime;
    [659.25, 880, 1318.5].forEach((f, i) => {
      const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + i * 0.16);
      g.gain.exponentialRampToValueAtTime(0.2, t + i * 0.16 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.16 + 0.7);
      o.connect(g); g.connect(this.ctx.destination); o.start(t + i * 0.16); o.stop(t + i * 0.16 + 0.8);
    });
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  async enableAlerts() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !this.ctx) this.ctx = new AC();
    if (this.ctx && this.ctx.state === 'suspended') await this.ctx.resume();
    try { if (navigator.wakeLock) this.lock = await navigator.wakeLock.request('screen'); } catch (e) {}
    this.setState({ alerts: true }, () => this.alert(0));
  }
  ping() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [[1567.98, 0], [2093, 0.12], [2637, 0.24]].forEach(([f, d]) => {
      const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.12, t + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.6);
      o.connect(g); g.connect(this.ctx.destination); o.start(t + d); o.stop(t + d + 0.7);
    });
  }
  async move(o, status) {
    const prev = o.status;
    if (status === 'ready') { clearTimeout(this.sentT); this.setState({ sent: { name: o.name, k: Date.now() } }); this.ping(); this.sentT = setTimeout(() => this.setState({ sent: null }), 3200); }
    this.setState({ orders: this.state.orders.map((x) => (x.id === o.id ? { ...x, status, updated_at: new Date().toISOString() } : x)) });
    try { await rpc('kitchen_set_status', { p_key: KEY, p_id: o.id, p_status: status }); }
    catch (e) { this.setState({ orders: this.state.orders.map((x) => (x.id === o.id ? { ...x, status: prev } : x)), offline: true }); }
  }
  async deleteOrder(o) {
    const keep = this.state.orders;
    this.setState({ orders: keep.filter((x) => x.id !== o.id), confirmDel: null });
    try { await rpc('kitchen_delete_order', { p_key: KEY, p_id: o.id }); }
    catch (e) { this.setState({ orders: keep, offline: true }); }
  }
  async loadWishes() {
    try { const w = await rpc('kitchen_wishes', { p_key: KEY }); this.setState({ wishes: w || [] }); } catch (e) {}
  }
  async hideWish(w) {
    this.setState({ wishes: this.state.wishes.map((x) => (x.id === w.id ? { ...x, hidden: !w.hidden } : x)) });
    try { await rpc('kitchen_hide_wish', { p_key: KEY, p_id: w.id, p_hidden: !w.hidden }); } catch (e) { this.loadWishes(); }
  }
  async reset(scope) {
    if (this.state.resetBusy) return;
    this.setState({ resetBusy: true, resetMsg: '' });
    try {
      const r = await rpc('kitchen_reset', { p_key: KEY, p_scope: scope });
      const msg = scope === 'all'
        ? 'Done. Removed ' + r.orders + ' orders, ' + r.ratings + ' ratings, ' + r.wishes + ' wishes and ' + r.scores + ' scores.'
        : 'Done. Removed ' + r.orders + ' orders.';
      this.seen = new Set();
      this.setState({ resetBusy: false, resetMsg: msg, resetText: '', armOrders: false, orders: [], wishes: scope === 'all' ? [] : this.state.wishes });
      this.load();
    } catch (e) { this.setState({ resetBusy: false, resetMsg: 'That did not work. Please check the connection and try again.' }); }
  }
  manage() {
    const st = this.state;
    const ready = st.resetText.trim().toUpperCase() === 'RESET';
    const box = 'background:#FFFFFF;border:1px solid rgba(27,34,56,.18);padding:18px;display:flex;flex-direction:column;gap:12px';
    return html`<div style="padding:16px 20px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start">
      <section style=${box}>
        <h2 class="serif" style="margin:0;font-size:26px;font-weight:500">Birthday wishes</h2>
        <span style="font-size:15px;color:#4A5570">Hidden wishes stay off the TV board.</span>
        ${st.wishes.length === 0 && html`<span style="font-size:17px;color:#4A5570;font-style:italic">No wishes yet.</span>`}
        <div style="display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto">
          ${st.wishes.map((w) => html`<div key=${w.id} style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(27,34,56,.1);opacity:${w.hidden ? 0.5 : 1}">
            <span style="flex:1;min-width:0;font-size:17px;line-height:1.4;word-break:break-word"><b>${w.name || 'A guest'}</b>: ${w.message}</span>
            <button class="press label" onClick=${() => this.hideWish(w)} style="flex:none;height:44px;padding:0 12px;border:1.5px solid ${INK};border-radius:6px;background:${w.hidden ? INK : '#FFFFFF'};color:${w.hidden ? '#FFFFFF' : INK};font-size:12px">${w.hidden ? 'Show' : 'Hide'}</button>
          </div>`)}
        </div>
      </section>
      <section style=${box}>
        <h2 class="serif" style="margin:0;font-size:26px;font-weight:500">Reset</h2>
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:17px;font-weight:600">Clear all orders</span>
          <span style="font-size:15px;color:#4A5570">Removes every ticket. Ratings, wishes and game scores stay.</span>
          <button class="press label" onClick=${() => (st.armOrders ? this.reset('orders') : this.setState({ armOrders: true, resetMsg: '' }))} disabled=${st.resetBusy} style="height:52px;border:2px solid #C2416B;border-radius:6px;background:${st.armOrders ? '#C2416B' : '#FFFFFF'};color:${st.armOrders ? '#FFFFFF' : '#C2416B'};font-size:14px">${st.armOrders ? 'Tap again to clear all orders' : 'Clear all orders'}</button>
          ${st.armOrders && html`<button onClick=${() => this.setState({ armOrders: false })} style="height:40px;border:0;background:transparent;color:#4A5570;font-size:15px;text-decoration:underline">Cancel</button>`}
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(27,34,56,.12);padding-top:12px">
          <span style="font-size:17px;font-weight:600">Reset the whole party</span>
          <span style="font-size:15px;color:#4A5570">Removes orders, ratings, wishes and game scores. Use this after testing. Type RESET to confirm.</span>
          <input type="text" value=${st.resetText} onInput=${(e) => this.setState({ resetText: e.target.value })} placeholder="Type RESET" aria-label="Type RESET to confirm" autocapitalize="characters" style="height:52px;border:1.5px solid rgba(27,34,56,.35);border-radius:6px;padding:0 12px;font-size:18px;font-family:inherit" />
          <button class="press label" onClick=${() => this.reset('all')} disabled=${!ready || st.resetBusy} style="height:52px;border:0;border-radius:6px;background:${ready ? '#C2416B' : '#D8D6D0'};color:${ready ? '#FFFFFF' : '#5B6075'};font-size:14px">${st.resetBusy ? 'Working…' : 'Reset everything'}</button>
        </div>
        ${st.resetMsg && html`<span role="status" style="font-size:16px;color:#2E7D4F">${st.resetMsg}</span>`}
      </section>
    </div>`;
  }
  ticket(o, c) {
    const fresh = !!this.state.fresh[o.id];
    const lines = [['Bread', o.bread], ['Fill', o.fillings], ['Sauce', o.sauces], ['Side', o.side]];
    return html`<div key=${o.id} class="ticket" style="filter:drop-shadow(0 2px 3px rgba(27,34,56,.14))">
      <div class="zig"></div>
      <div class=${fresh ? 'flash' : ''} style="background:#FFFFFF;padding:6px 16px 16px;display:flex;flex-direction:column;gap:10px;border-left:6px solid ${c.flag}">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1.5px dotted rgba(27,34,56,.4);padding-bottom:6px">
          <span class="serif" style="font-size:30px;line-height:1.1;font-weight:500;word-break:break-word">${o.name}</span>
          <span style="font-size:15px;color:#4A5570;white-space:nowrap">${ago(o.created_at)}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="label" style="font-size:11px;border:1px solid rgba(27,34,56,.3);padding:3px 8px">${LANG[o.lang] || o.lang}</span>
          ${fresh && html`<span class="label pulse" style="font-size:12px;color:#C2416B;border:2px solid #C2416B;padding:2px 8px">Just in</span>`}
        </div>
        <div style="display:flex;flex-direction:column;gap:7px">
          ${lines.map(([k, val]) => html`<div style="display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:baseline">
            <span class="label" style="font-size:12px;color:#C2416B">${k}</span>
            <span style="font-size:19px;line-height:1.35">${val}</span>
          </div>`)}
        </div>
        ${o.note && html`<div style="display:flex;gap:10px;align-items:flex-start;background:#FFE27A;padding:8px 10px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2238" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17.5v.5"></path></svg>
          <span style="font-size:19px;font-weight:600;line-height:1.35;word-break:break-word">${o.note}</span>
        </div>`}
        <button class="press label" onClick=${() => this.move(o, c.next)} style="height:58px;border-radius:6px;border:2px solid ${INK};background:${c.key === 'ready' ? '#FFFFFF' : INK};color:${c.key === 'ready' ? INK : '#FFFFFF'};font-size:16px">${c.btn}</button>
        ${this.state.confirmDel === o.id ? html`<div style="display:flex;flex-direction:column;gap:8px;background:#FDEBF0;padding:10px">
            <span style="font-size:16px;font-weight:600">Remove this order? The guest will be told it was cancelled.</span>
            <div style="display:flex;gap:8px">
              <button class="press label" onClick=${() => this.deleteOrder(o)} style="flex:1;height:48px;border:0;border-radius:6px;background:#C2416B;color:#FFFFFF;font-size:13px">Yes, remove</button>
              <button class="press label" onClick=${() => this.setState({ confirmDel: null })} style="flex:1;height:48px;border:1.5px solid ${INK};border-radius:6px;background:#FFFFFF;color:${INK};font-size:13px">Keep it</button>
            </div>
          </div>` : html`<div style="display:flex;justify-content:space-between;align-items:center">
            ${c.prev ? html`<button onClick=${() => this.move(o, c.prev)} style="height:40px;border:0;background:transparent;color:#4A5570;font-size:15px;text-decoration:underline;text-underline-offset:3px">Undo</button>` : html`<span></span>`}
            <button onClick=${() => this.setState({ confirmDel: o.id })} style="height:40px;border:0;background:transparent;color:#C2416B;font-size:15px;text-decoration:underline;text-underline-offset:3px">Remove</button>
          </div>`}
      </div>
    </div>`;
  }
  render() {
    const st = this.state;
    if (st.denied) return html`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center">
      <span class="serif" style="font-style:italic;font-size:44px">Giena's</span>
      <span style="font-size:20px">This page is for the kitchen only.</span>
      <span style="font-size:16px;color:#4A5570">Please scan the kitchen QR code again.</span></div>`;
    const by = (k) => st.orders.filter((o) => o.status === k);
    const stats = st.stats || {};
    return html`<div>
      <div style="position:sticky;top:0;z-index:5;background:#F6F1E7;border-bottom:3px double ${INK};padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="display:flex;flex-direction:column;align-items:center;line-height:1"><span class="serif" style="font-style:italic;font-size:30px">Giena's</span><span class="label" style="font-size:10px;letter-spacing:.45em;margin-top:4px">Deli</span></div>
          <span style="width:1px;height:40px;background:rgba(27,34,56,.25)"></span>
          <span class="serif" style="font-size:30px">Kitchen</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          ${COLS.map((c) => html`<div style="display:flex;align-items:baseline;gap:6px"><span class="serif" style="font-size:32px;color:${c.key === 'new' ? '#C2416B' : INK}">${by(c.key).length}</span><span style="font-size:16px">${c.key}</span></div>`)}
          <div style="display:flex;align-items:baseline;gap:6px;color:#4A5570"><span class="serif" style="font-size:32px">${stats.collected ?? 0}</span><span style="font-size:16px">collected</span></div>
          <div style="display:flex;align-items:baseline;gap:6px"><span class="serif" style="font-size:32px;color:#8A6A2F">${stats.avg ?? '–'}</span><span style="font-size:16px">★ (${stats.ratings ?? 0})</span></div>
          <button class="press label" onClick=${() => { const m = !st.manage; this.setState({ manage: m, resetMsg: '', armOrders: false }); if (m) this.loadWishes(); }} aria-pressed=${st.manage} style="height:48px;padding:0 16px;border:2px solid ${INK};border-radius:6px;background:${st.manage ? INK : 'transparent'};color:${st.manage ? '#FFFFFF' : INK};font-size:13px">${st.manage ? 'Close manage' : 'Manage'}</button>
          ${!st.alerts ? html`<button class="press label" onClick=${() => this.enableAlerts()} style="height:48px;padding:0 16px;border:0;border-radius:6px;background:#C2416B;color:#FFFFFF;font-size:13px">Turn on order alerts</button>`
            : html`<span class="label" style="font-size:12px;color:#2E7D4F">● Alerts on</span>`}
        </div>
      </div>
      ${st.sent && html`<div key=${st.sent.k} class="sent" role="status">
        <span class="sent-ic" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B2238" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L21 3l-6.5 18-3.2-7.3z"></path><path d="M11.3 13.7L21 3"></path></svg></span>
        <span style="display:flex;flex-direction:column;gap:2px"><span class="serif" style="font-size:24px;line-height:1.1">Sent to ${st.sent.name}</span><span style="font-size:15px;color:#4A5570">Their phone just lit up with the good news.</span></span>
        ${[0, 1, 2, 3, 4, 5].map((i) => html`<i class="sent-sp" style="--a:${i * 60}deg;--c:${['#F9D6DF', '#FFE9A8', '#D9E6F1'][i % 3]}"></i>`)}
      </div>`}
      ${st.manage && this.manage()}
      ${st.offline && html`<div role="alert" style="background:#C2416B;color:#FFFFFF;padding:10px 20px;font-size:17px">Connection lost. Retrying…</div>`}
      ${!st.loaded ? html`<p style="padding:40px;text-align:center;font-size:18px">Loading orders…</p>` : html`<div class="cols">
        ${COLS.map((c) => html`<section style="display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid ${INK};padding-bottom:6px">
            <h2 class="serif" style="margin:0;font-size:28px;font-weight:500">${c.title}</h2>
            <span style="width:34px;height:34px;border-radius:50%;background:${c.dot};border:2px solid ${INK};font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center">${by(c.key).length}</span>
          </div>
          ${by(c.key).length === 0 && html`<div style="padding:22px 8px;text-align:center;font-size:18px;color:#4A5570;border:2px dashed rgba(27,34,56,.3)">${c.empty}</div>`}
          ${by(c.key).map((o) => this.ticket(o, c))}
        </section>`)}
      </div>`}
    </div>`;
  }
}
render(html`<${Kitchen} />`, document.getElementById('app'));
