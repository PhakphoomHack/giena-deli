<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<title>Giena's Deli</title>
<meta name="description" content="Build your own sandwich at Giena's 27th birthday.">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300..600&family=Noto+Serif+Thai:wght@400..600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero.webp">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%}
body{background:#F6F1E7;color:#1B2238;font-family:Jost,'Sarabun',system-ui,sans-serif;overflow-x:hidden;transition:background .8s ease}
body.dark{background:#121828}
a{color:#1B2238}a:hover{color:#8A6A2F}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #8A6A2F;outline-offset:3px}
img{display:block}
.serif{font-family:'Bodoni Moda','Noto Serif Thai',Didot,'Times New Roman',serif;font-optical-sizing:auto}
.label{font-family:Jost,'Sarabun',sans-serif;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.lang-th .label{letter-spacing:.02em}
.lang-th *{font-style:normal !important}
.hy{-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
.screen{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.press{transition:transform .12s ease,background-color .25s ease,color .25s ease,border-color .25s ease}
.press:active{transform:scale(.97)}
.badge{animation:badge .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes badge{from{transform:scale(.3)}to{transform:scale(1)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.spin{animation:spin 11s linear infinite}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(0deg)}to{transform:rotateX(-24deg) rotateY(360deg)}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.drop{animation:drop .6s cubic-bezier(.3,1.25,.5,1) both}
@keyframes drop{0%{transform:translateY(-240px);visibility:hidden}1%{visibility:visible}100%{transform:translateY(0);visibility:visible}}
.ph{background-repeat:no-repeat;background-position:center;background-size:100% 100%}
.ph-crumb{background-image:url(img/crumb.webp)}
.ph-toast{background-image:url(img/toasted.webp)}
.ph-crust{background-image:url(img/crust.webp)}
.ph-brisket{background-image:url(img/brisket.webp)}
.ph-avocado{background-image:url(img/avocado.webp)}
.ph-onion{background-image:url(img/onion.webp)}
.ph-cheese{background-image:url(img/cheese.webp)}
.ph-mustard{background-image:url(img/mustard.webp)}
.ph-garlic{background-image:url(img/garlic.webp)}
.ph-thousand{background-image:url(img/thousand.webp)}
.ph-pesto{background-image:url(img/pesto-2.webp)}
.ph-pickle{background-image:url(img/pickle_top.webp)}
.bulb{box-shadow:0 0 10px rgba(232,212,154,.7);animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.3}}
.swing{animation-name:swing;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
@keyframes swing{from{transform:translateX(calc(var(--amp,120px) * -1))}to{transform:translateX(var(--amp,120px))}}
.land{animation:land .36s cubic-bezier(.5,0,.6,1) both}
@keyframes land{0%{transform:translateY(-70px)}70%{transform:translateY(0)}85%{transform:translateY(-5px)}100%{transform:translateY(0)}}
.ring{animation:ring .6s ease-out forwards}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.4);opacity:0}}
.spark{position:absolute;top:0;width:0;height:0}
.spark span{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#FFE9A8;box-shadow:0 0 8px #E8D49A;animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translateY(-74px) scale(.3);opacity:0}}
.ptext{animation:ptext 1.1s ease-out forwards}
@keyframes ptext{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-40px) scale(1)}}
.offL{animation:offL .8s ease-in forwards}
.offR{animation:offR .8s ease-in forwards}
@keyframes offL{to{transform:translate(-170px,420px) rotate(-70deg);opacity:0}}
@keyframes offR{to{transform:translate(170px,420px) rotate(70deg);opacity:0}}
.mtext{animation:mtext 1.6s ease-out forwards}
@keyframes mtext{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.08)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
.conf{position:absolute;top:-24px;border-radius:2px;animation-name:conf;animation-timing-function:cubic-bezier(.3,.6,.6,1);animation-fill-mode:forwards}
@keyframes conf{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(110vh) rotate(720deg)}}
.star{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.star-on{transform:scale(1.08)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;outline:none;margin:0;cursor:pointer;background:rgba(27,34,56,.18)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;background:#FFFFFF;border:1.5px solid #1B2238;box-shadow:0 4px 12px rgba(27,34,56,.22)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#FFFFFF;border:1.5px solid #1B2238;box-shadow:0 4px 12px rgba(27,34,56,.22)}
input::placeholder,textarea::placeholder{color:#7A7F92;font-style:italic}
.dark-ta::placeholder{color:rgba(246,241,231,.5)}
.boot{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:'Bodoni Moda',serif}
/* Sandwich Match */
.mbg{position:fixed;inset:0;pointer-events:none;background-color:#FBF4EC;background-image:linear-gradient(90deg,rgba(249,214,223,.42) 50%,transparent 50%),linear-gradient(rgba(249,214,223,.42) 50%,transparent 50%);background-size:44px 44px}
.mbg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 45%,rgba(251,244,236,.0),rgba(251,244,236,.85) 80%)}
.mtray{position:relative;margin:0 auto;padding:9px;border-radius:26px;background:linear-gradient(135deg,#ECCD99 0%,#D9AE70 38%,#E8C38C 58%,#CF9F60 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(120,72,30,.28),0 18px 30px rgba(120,72,30,.22)}
.mtray:before,.mtray:after{content:"";position:absolute;top:50%;width:16px;height:64px;margin-top:-32px;border-radius:9px;background:linear-gradient(180deg,#E8C38C,#CF9F60);box-shadow:inset 0 0 0 5px rgba(0,0,0,0),inset 0 2px 0 rgba(255,255,255,.45),0 4px 8px rgba(120,72,30,.2)}
.mtray:before{left:-12px}.mtray:after{right:-12px}
.mboard{position:relative;border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background-color:#FFFDF8;background-image:linear-gradient(90deg,rgba(217,230,241,.55) 50%,transparent 50%),linear-gradient(rgba(217,230,241,.55) 50%,transparent 50%);box-shadow:inset 0 2px 8px rgba(120,72,30,.28);overflow:hidden}
.mt{position:absolute;left:0;top:0;transition:transform .19s cubic-bezier(.3,.8,.4,1);will-change:transform}
.mt-b{position:absolute;inset:0;transform-origin:50% 100%}
.mfall{animation:mfall .42s cubic-bezier(.33,1,.55,1) both}
@keyframes mfall{0%{transform:translateY(var(--fy))}68%{transform:translateY(0) scale(1)}80%{transform:scale(1.1,.86)}91%{transform:scale(.97,1.04)}100%{transform:none}}
.mt-in{--l:#FFFFFF;--m:#EEE;--d:#CCC;position:absolute;inset:3px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 36%,var(--l) 0,var(--l) 42%,var(--m) 100%);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.8),0 3px 0 var(--d),0 6px 8px rgba(27,34,56,.16);transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.mt-in::before{content:"";position:absolute;left:18%;top:9%;width:34%;height:18%;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-18deg);pointer-events:none}
.mt-in img{width:94%;height:94%;object-fit:contain;pointer-events:none;position:relative;z-index:1;-webkit-user-drag:none;transform:translateY(-1px)}
.mt-brisket{--l:#FFF1F5;--m:#F7C5D2;--d:#E296AB}
.mt-avocado{--l:#F2FCF0;--m:#C3E8C6;--d:#8DC794}
.mt-onion{--l:#FFF4EB;--m:#F9CDAE;--d:#E2A378}
.mt-cheese{--l:#FFFAE3;--m:#FFE193;--d:#E6B64C}
.mt-pickle{--l:#F8F4FF;--m:#D9CEF5;--d:#AA98DC}
.mt-toast{--l:#F4F9FE;--m:#CBDDF0;--d:#92B3D6}
.mt-pesto{--l:#FFFFFF;--m:#EAEEE5;--d:#B8C1AC}
.mt-gold{--l:#FFF8D9;--m:#F6CC52;--d:#C8931B;animation:mglow 1.6s ease-in-out infinite}
@keyframes mglow{0%,100%{filter:drop-shadow(0 0 4px rgba(246,204,82,.6))}50%{filter:drop-shadow(0 0 12px rgba(246,204,82,1))}}
.mt-in.sel{transform:translateY(-4px) scale(1.12);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.8),0 0 0 3px #FFFFFF,0 0 0 6px #1B2238,0 8px 0 var(--d),0 12px 16px rgba(27,34,56,.25);z-index:3}
.mt-in.sel img{animation:selWig 1s ease-in-out infinite}
@keyframes selWig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.mt-in.hint{animation:mhint 1.1s ease-in-out infinite}
@keyframes mhint{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12) rotate(-8deg)}60%{transform:scale(1.12) rotate(8deg)}}
.mt-in.hop img{animation:hop .62s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:none}35%{transform:translateY(-7px) scale(.95,1.06)}65%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
.mt-in.bad{animation:mbad .3s ease-in-out}
@keyframes mbad{20%{transform:translateX(-5px) rotate(-4deg)}60%{transform:translateX(5px) rotate(4deg)}}
.sp-h::after,.sp-v::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,0) 0 18%,rgba(255,255,255,.8) 18% 26%);background-size:100% 200%;animation:mshineV 1.2s linear infinite;-webkit-mask:radial-gradient(circle,#000 60%,transparent 62%);mask:radial-gradient(circle,#000 60%,transparent 62%)}
.sp-v::after{background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 18%,rgba(255,255,255,.8) 18% 26%);background-size:200% 100%;animation-name:mshineH}
@keyframes mshineV{to{background-position:0 100%}}
@keyframes mshineH{to{background-position:100% 0}}
.sp-h,.sp-v{box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.9),0 3px 0 var(--d),0 0 0 3px #FFFFFF,0 0 14px 4px rgba(255,233,168,.95)}
.sp-x{box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.9),0 3px 0 var(--d),0 0 0 3px #FFFFFF,0 0 14px 4px rgba(194,65,107,.5)}
.sp-x::after{content:"";position:absolute;inset:-4px;border-radius:50%;z-index:2;pointer-events:none;background:conic-gradient(from 0deg,rgba(255,255,255,0),#FFFFFF,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 50%,#FFFFFF,rgba(255,255,255,0) 80%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%);animation:mspin 1.8s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
.mpop{pointer-events:none;z-index:4}
.mpop .mt-in{animation:mpop .28s ease-in forwards}
@keyframes mpop{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.3) rotate(-10deg)}100%{transform:scale(0) rotate(20deg);opacity:0}}
.mspk span{width:12px;height:12px;left:-6px;top:-6px;border-radius:0;background:var(--pc);box-shadow:none;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation-duration:.6s}
.mspk:nth-child(even) span{width:9px;height:9px;left:-4.5px;top:-4.5px;clip-path:circle(50%)}
.mline{position:absolute;z-index:5;pointer-events:none}
.mline-h{left:0;right:0;background:linear-gradient(90deg,rgba(255,255,255,0),#FFFFFF 20%,#FFE9A8 50%,#FFFFFF 80%,rgba(255,255,255,0));animation:mlineH .5s ease-out forwards}
.mline-v{top:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0),#FFFFFF 20%,#FFE9A8 50%,#FFFFFF 80%,rgba(255,255,255,0));animation:mlineV .5s ease-out forwards}
@keyframes mlineH{0%{opacity:0;transform:scaleX(.1)}30%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleY(.2)}}
@keyframes mlineV{0%{opacity:0;transform:scaleY(.1)}30%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleX(.2)}}
.mgold{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle,rgba(255,233,168,.95),rgba(255,233,168,0) 72%);animation:mgold .7s ease-out forwards}
@keyframes mgold{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.mfloat{position:absolute;z-index:6;pointer-events:none;padding:1px 9px 2px;border-radius:999px;background:#FFFFFF;border:2px solid var(--fc,#1B2238);font-family:Jost,sans-serif;font-weight:600;font-size:16px;color:#1B2238;white-space:nowrap;box-shadow:0 2px 0 var(--fc,#1B2238);animation:mfloat 1s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes mfloat{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}70%{opacity:1;transform:translate(-50%,-110%) scale(1)}100%{opacity:0;transform:translate(-50%,-150%) scale(.95)}}
.mword{position:absolute;left:50%;top:44%;z-index:7;pointer-events:none;white-space:nowrap;padding:9px 26px 11px;background:#C2416B;color:#FFFFFF;font-family:'Bodoni Moda','Noto Serif Thai',serif;font-style:italic;font-weight:600;font-size:32px;line-height:1;box-shadow:0 4px 0 #8E2C4C,0 10px 18px rgba(142,44,76,.3);animation:ribbon 1.35s cubic-bezier(.2,1.4,.4,1) forwards}
.mword:before,.mword:after{content:"";position:absolute;top:10px;width:22px;height:100%;background:#A8335A;z-index:-1}
.mword:before{left:-14px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.mword:after{right:-14px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
@keyframes ribbon{0%{opacity:0;transform:translate(-50%,-50%) rotate(-4deg) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1.12)}32%{transform:translate(-50%,-50%) rotate(-4deg) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) rotate(-4deg) scale(.96)}}
.mticket{position:relative;background:#FFFFFF;padding:8px 16px 10px;display:flex;align-items:stretch;gap:14px;filter:drop-shadow(0 5px 6px rgba(27,34,56,.14))}
.mticket:after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:linear-gradient(-45deg,#FFFFFF 6px,transparent 0),linear-gradient(45deg,#FFFFFF 6px,transparent 0);background-size:12px 12px;background-repeat:repeat-x;background-position:left top}
.mticket .sep{width:0;border-left:2px dotted rgba(27,34,56,.25)}
.mbub{position:relative;max-width:190px;background:#FFFFFF;border:2px solid #1B2238;border-radius:16px;padding:7px 12px 8px;font-size:15px;line-height:1.3;color:#1B2238;box-shadow:0 3px 0 #1B2238;animation:bubIn .5s cubic-bezier(.3,1.6,.5,1) both}
.mbub:before{content:"";position:absolute;left:-9px;top:50%;width:13px;height:13px;margin-top:-7px;background:#FFFFFF;border-left:2px solid #1B2238;border-bottom:2px solid #1B2238;transform:rotate(45deg)}
@keyframes bubIn{from{opacity:0;transform:scale(.5) translateX(-10px)}to{opacity:1;transform:none}}
.mz{display:block;overflow:visible;flex:none}
.mz-bob{transform-box:view-box;transform-origin:50px 88px;animation:mzBob 2.8s ease-in-out infinite}
@keyframes mzBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px) scale(1.015,.99)}}
.mz-react{transform-box:view-box;transform-origin:50px 88px}
.mz-eyes{transform-box:view-box;transform-origin:50px 47px;animation:mzBlink 4.2s infinite}
@keyframes mzBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mz-happy .mz-react,.mz-cheer .mz-react{animation:mzHop .6s cubic-bezier(.3,1.6,.5,1)}
.mz-cheer .mz-react{animation-iteration-count:3}
@keyframes mzHop{0%{transform:none}30%{transform:translateY(-12px) scale(.94,1.07)}62%{transform:translateY(0) scale(1.09,.9)}100%{transform:none}}
.mz-wow .mz-react{animation:mzWow .85s cubic-bezier(.3,1.6,.5,1)}
@keyframes mzWow{0%{transform:none}35%{transform:translateY(-20px) rotate(-12deg) scale(1.1)}70%{transform:translateY(0) rotate(7deg)}100%{transform:none}}
.mz-oops .mz-react{animation:mzOops .5s ease-in-out}
@keyframes mzOops{20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.mcard>*{flex-shrink:0}
.pulse-soft{animation:psoft 1.2s ease-in-out infinite}
@keyframes psoft{50%{transform:scale(1.06)}}
/* Ready reveal */
.rp{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:24px 22px calc(24px + env(safe-area-inset-bottom));background:rgba(18,24,40,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:hidden;animation:rpFade .35s ease-out both}
@keyframes rpFade{from{opacity:0}to{opacity:1}}
.rp-rays{position:absolute;left:50%;top:38%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,rgba(255,233,168,.16) 0 8deg,rgba(255,233,168,0) 8deg 20deg,rgba(249,214,223,.12) 20deg 28deg,rgba(249,214,223,0) 28deg 40deg);-webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 18%,transparent 46%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 18%,transparent 46%);opacity:0;animation:rpRaysIn .8s ease-out 1.3s forwards,rpSpin 40s linear 1.3s infinite}
@keyframes rpRaysIn{to{opacity:1}}
@keyframes rpSpin{to{transform:rotate(360deg)}}
.rp-stage{position:relative;width:260px;height:236px;flex:none}
.rp-glow{position:absolute;left:50%;top:52%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,rgba(255,233,168,.55),rgba(255,233,168,0) 62%);opacity:0;transform:scale(.4);animation:rpGlow .9s cubic-bezier(.2,1.3,.5,1) 1.3s forwards,rpGlowPulse 2.4s ease-in-out 2.2s infinite}
@keyframes rpGlow{to{opacity:1;transform:scale(1)}}
@keyframes rpGlowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.rp-plate{position:absolute;left:50%;bottom:22px;width:244px;height:54px;margin-left:-122px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#FFFFFF 0,#FFFFFF 55%,#E6ECF4 56%,#FFFFFF 70%,#D9E2EE 100%);box-shadow:0 14px 26px rgba(0,0,0,.35)}
.rp-food{position:absolute;left:50%;bottom:36px;width:212px;height:auto;margin-left:-106px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35));opacity:0;transform:scale(.55);transform-origin:50% 90%;animation:rpPop .7s cubic-bezier(.3,1.7,.5,1) 1.32s forwards,rpBob 3s ease-in-out 2.2s infinite}
@keyframes rpPop{to{opacity:1;transform:scale(1)}}
@keyframes rpBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.rp-cloche{position:absolute;left:50%;bottom:20px;margin-left:-116px;transform-origin:50% 100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));animation:rpDrop .6s cubic-bezier(.3,1.5,.5,1) 0s both,rpWiggle .5s ease-in-out .7s,rpLift .7s cubic-bezier(.5,-.35,.7,1) 1.22s forwards}
@keyframes rpDrop{from{transform:translateY(-260px);opacity:0}60%{opacity:1}to{transform:translateY(0);opacity:1}}
@keyframes rpWiggle{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-6px) rotate(-5deg)}45%{transform:translateY(0) rotate(4deg)}70%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes rpLift{0%{transform:translateY(0) rotate(0);opacity:1}25%{transform:translateY(8px) rotate(0)}100%{transform:translateY(-280px) translateX(70px) rotate(24deg);opacity:0}}
.rp-burst{position:absolute;left:50%;top:50%;width:0;height:0}
.rp-spk{position:absolute;left:0;top:0;width:0;height:0}
.rp-spk i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);opacity:0;animation:rpSpark .9s cubic-bezier(.2,.8,.3,1) 1.3s forwards}
.rp-spk:nth-child(odd) i{width:7px;height:7px;left:-3.5px;top:-3.5px;border-radius:1px;transform:rotate(45deg)}
@keyframes rpSpark{0%{opacity:0;transform:translateY(0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--len) * -1)) scale(1)}}
.rp-steam{position:absolute;left:50%;bottom:150px;width:90px;height:60px;margin-left:-45px}
.rp-steam span{position:absolute;bottom:0;width:10px;height:42px;border-radius:50%;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.45));filter:blur(3px);opacity:0;animation:rpSteam 2.4s ease-in-out infinite}
.rp-steam span:nth-child(1){left:12px;animation-delay:1.8s}
.rp-steam span:nth-child(2){left:40px;animation-delay:2.3s}
.rp-steam span:nth-child(3){left:68px;animation-delay:2.8s}
@keyframes rpSteam{0%{opacity:0;transform:translateY(10px) scaleY(.6)}35%{opacity:.9}100%{opacity:0;transform:translateY(-34px) translateX(6px) scaleY(1.2)}}
.rp-in{opacity:0;transform:translateY(14px);animation:rpIn .55s cubic-bezier(.2,1.2,.4,1) var(--d,0s) forwards}
@keyframes rpIn{to{opacity:1;transform:none}}
.rp-btn{margin-top:24px;width:100%;max-width:340px;height:62px;border:0;border-radius:999px;background:#FFE9A8;color:#121828;font-size:16px;box-shadow:0 0 0 0 rgba(255,233,168,.6);animation:rpIn .55s cubic-bezier(.2,1.2,.4,1) var(--d,0s) forwards,rpRing 1.8s ease-out 2.6s infinite}
@keyframes rpRing{0%{box-shadow:0 0 0 0 rgba(255,233,168,.5),0 0 24px rgba(255,233,168,.35)}100%{box-shadow:0 0 0 10px rgba(255,233,168,0),0 0 24px rgba(255,233,168,.35)}}
@media (prefers-reduced-motion: reduce){.rp-rays,.rp-glow,.rp-food,.rp-cloche,.rp-spk i,.rp-steam span,.rp-in,.rp-btn{animation:none!important}.rp-cloche{display:none}.rp-food,.rp-glow,.rp-in,.rp-rays{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.mz-bob,.mz-eyes,.mz-react,.mt-in.hop img,.mt-in.sel img,.spin,.float,.bulb,.pulse,.mt-in.hint,.sp-h::after,.sp-v::after,.sp-x::after,.mt-gold,.pulse-soft{animation:none}}
</style>
